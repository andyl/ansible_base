# Install Incus from the Zabbly repo
#
# apt-key is gone on Ubuntu 26.04 (apt 3.x), so the key goes in
# /etc/apt/keyrings and the repo line uses signed-by.

- name: create apt keyrings directory
  file:
    path: /etc/apt/keyrings
    state: directory
    mode: "0755"

- name: add incus apt key
  get_url:
    url:  https://pkgs.zabbly.com/key.asc
    dest: /etc/apt/keyrings/zabbly.asc
    mode: "0644"

# old repo line (no signed-by) conflicts with the new one
- name: remove old incus repository
  apt_repository:
    repo: 'deb https://pkgs.zabbly.com/incus/stable {{ ansible_distribution_release }} main'
    state: absent
    update_cache: false

- name: add incus repository
  apt_repository:
    repo: 'deb [signed-by=/etc/apt/keyrings/zabbly.asc] https://pkgs.zabbly.com/incus/stable {{ ansible_distribution_release }} main'
    filename: zabbly-incus-stable
    state: present
    update_cache: false

- name: install incus packages
  apt:
    name:
      - incus
      - incus-client
      - incus-extra               # includes incus-compose and distrobuilder
      - incus-ui-canonical
      - zfsutils-linux
      - debootstrap
    state: latest
    update_cache: true
  become: true

# Ubuntu creates an 'lxd' group by default; Incus replaces LXD, so drop it.
- name: remove lxd group
  group:
    name: lxd
    state: absent

- name: create incus groups
  group:
    name: "{{item}}"
    state: present
  loop:
    - incus
    - incus-admin

# The incus socket (/var/lib/incus/unix.socket) is root:incus-admin 0660.
# Group changes only take effect in NEW login sessions - an existing shell
# gets "You don't have the needed permissions to talk to the incus daemon"
# until the user logs out and back in (or runs `newgrp incus-admin`).
- name: add user to incus groups
  user:
    name: "{{gen_user}}"
    groups: [incus, incus-admin]
    append: yes
  register: incus_user_groups

- name: incus group membership needs a new login
  debug:
    msg: >-
      {{ gen_user }} was added to the incus and incus-admin groups. Log out
      and back in (or run `newgrp incus-admin`) before using the incus CLI.
  when: incus_user_groups is changed
