# Install LazyIncus 
#
# - https://discuss.linuxcontainers.org/t/lazyincus-a-lazydocker-style-terminal-ui-for-incus/27283 
# - https://github.com/tallica/lazyincus 
#

- name: create lazyincus pkg dirs
  file: 
    path:  "{{item}}"
    state: directory 
    group: "{{gen_user}}"
    owner: "{{gen_user}}"
  loop:
    - /home/{{gen_user}}/.pkg
    - /home/{{gen_user}}/.pkg/Bin
    - /home/{{gen_user}}/.pkg/lzinc
    - /home/{{gen_user}}/.pkg/lzinc/{{lzinc_vsn}}

- name: get lazyincus tar file 
  get_url: 
    url:      https://github.com/tallica/lazyincus/releases/download/v{{lzinc_vsn}}/lazyincus_{{lzinc_vsn}}_linux_amd64.tar.gz
    checksum: sha256:https://github.com/tallica/lazyincus/releases/download/v{{lzinc_vsn}}/checksums.txt
    dest:     /home/{{gen_user}}/.pkg/lzinc/lazyincus_{{lzinc_vsn}}.tar.gz
    mode:     "a+r"
    group:    "{{gen_user}}"
    owner:    "{{gen_user}}"

- name: expand lazyincus tar file 
  unarchive:
    src:        /home/{{gen_user}}/.pkg/lzinc/lazyincus_{{lzinc_vsn}}.tar.gz
    dest:       /home/{{gen_user}}/.pkg/lzinc/{{lzinc_vsn}}
    creates:    /home/{{gen_user}}/.pkg/lzinc/{{lzinc_vsn}}/lazyincus
    remote_src: true
    group:      "{{gen_user}}"
    owner:      "{{gen_user}}"

- name: create lazyincus executable symlink
  file: 
    src:   /home/{{gen_user}}/.pkg/lzinc/{{lzinc_vsn}}/lazyincus
    dest:  /home/{{gen_user}}/.pkg/Bin/lazyincus
    state: link
    force: true
    group: "{{gen_user}}"
    owner: "{{gen_user}}"
