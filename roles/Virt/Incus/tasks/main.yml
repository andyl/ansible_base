---

# incus
# https://linuxcontainers.org/incus/introduction/
# https://github.com/lxc/incus
# https://github.com/zabbly/incus
#
# https://incus-compose.org/
# https://github.com/lxc/incus-compose
#
# https://discuss.linuxcontainers.org/t/lazyincus-a-lazydocker-style-terminal-ui-for-incus/27283
# https://github.com/tallica/lazyincus
#
# https://github.com/fredmj/incus-mcp-server
#
# https://github.com/marshalfevzi/skills
# https://github.com/marshalfevzi/skills/tree/main/skills/incus-lxc
#
# distrobuilder comes with the incus-extra package. So does incus-compose,
# but Zabbly's build lags upstream, so install_incus_compose.yml installs a
# pinned upstream release (inccmp_vsn) into ~/.pkg/Bin, ahead of /usr/bin.
# Run Net/Bridge before this role so the 'bridged' profile can be created
# (see config_incus.yml).

- name: install incus
  include_tasks: install_incus.yml
  when: is_physical | bool

- name: config incus
  include_tasks: config_incus.yml
  when: is_physical | bool

- name: install incus-compose
  include_tasks: install_incus_compose.yml
  when: is_physical | bool

- name: install lazyincus
  include_tasks: install_lazyincus.yml
  when: is_physical | bool

- name: install incus mcp
  include_tasks: install_incusmcp.yml
  when: is_physical | bool
