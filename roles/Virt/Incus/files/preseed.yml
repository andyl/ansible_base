---
# Applied once by config_incus.yml, only if Incus is not yet initialized.
# The default profile uses the NAT network (incusbr0), which works on every
# host.  Instances that should get a LAN IP also use the 'bridged' profile.
config:
  core.https_address: "[::]:8443"
  images.auto_update_interval: 15
networks:
  - config:
      ipv4.address: auto
      ipv6.address: none
    description: "Incus NAT bridge"
    name: incusbr0
    type: bridge
storage_pools:
  - config: {}
    driver: dir
    name: default
profiles:
  - config: {}
    description: "Default Incus profile"
    devices:
      root:
        path: /
        pool: default
        type: disk
      eth0:
        name: eth0
        network: incusbr0
        type: nic
    name: default
