---

# Linux bridge for Incus hosts - Xubuntu 26.04 only (physical desktops/laptops)
#
# NB: Ansible reports Xubuntu as ansible_distribution == 'Ubuntu', so we
# detect Xubuntu by the xubuntu-default-settings package.  The has_xfce
# predicate is not used because it depends on a logged-in XFCE session.

- name: check for Xubuntu desktop package
  command: dpkg-query -W -f='${Status}' xubuntu-default-settings
  register: xubuntu_pkg
  changed_when: false
  failed_when: false

- name: set bridge_host predicate
  set_fact:
    bridge_host: >-
      {{ ansible_distribution == 'Ubuntu'
         and ansible_distribution_version == '26.04'
         and 'install ok installed' in xubuntu_pkg.stdout
         and ansible_virtualization_role != 'guest' }}

- name: skip non-Xubuntu-26.04 hosts
  debug:
    msg: >-
      Skipping Net/Bridge on {{ ansible_hostname }}
      ({{ ansible_distribution }} {{ ansible_distribution_version }},
      virtualization role {{ ansible_virtualization_role }})
      - role only runs on physical Xubuntu 26.04 hosts
  when: not bridge_host | bool

- name: configure bridge
  include_tasks: bridge.yml
  when: bridge_host | bool
